name: waydroid-xhs
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  wd:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: System info
        run: |
          uname -a; nproc; free -h

      - name: Setup binder + deps
        run: |
          set -x
          sudo modprobe binder_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          ls -l /dev/binder* 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates lxc uidmap dbus policykit-1 python3 || true

      - name: Install waydroid
        run: |
          set -x
          sudo apt-get install -y -qq waydroid 2>&1 | tail -3 || {
            curl -s https://repo.waydro.id | sudo bash
            sudo apt-get install -y -qq waydroid 2>&1 | tail -3
          }
          waydroid --version || true

      - name: Init waydroid
        run: |
          set -x
          sudo waydroid init 2>&1 | tail -30
          echo "--- /var/lib/waydroid ---"
          sudo ls -la /var/lib/waydroid/ 2>/dev/null | head -20
          sudo du -sh /var/lib/waydroid 2>/dev/null || true

      - name: Start container
        run: |
          set -x
          sudo nohup waydroid container start > /tmp/wd-container.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 2
            if waydroid status 2>/dev/null | grep -q RUNNING; then echo "container RUNNING after $((i*2))s"; break; fi
          done
          timeout 10 waydroid status || true
          timeout 30 waydroid shell getprop ro.build.version.release || true
          timeout 30 waydroid shell getprop ro.product.cpu.abilist || true
          timeout 30 waydroid shell "ls /system/lib/arm 2>/dev/null | head -3" || true
          echo "--- adb targets ---"
          timeout 20 adb devices || true

      - name: Save logs
        if: always()
        run: |
          set -x
          timeout 30 sudo journalctl -u waydroid-container --no-pager | tail -40 || true
          timeout 30 sudo tail -60 /tmp/wd-container.log || true
          timeout 30 sudo tail -80 /var/lib/waydroid/waydroid.log 2>/dev/null || true
          timeout 15 sudo ls -la /var/lib/waydroid/ || true
