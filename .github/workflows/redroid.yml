name: redroid-xhs
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Pull redroid arm64
        id: img
        run: |
          set -x
          FOUND=""
          for IMG in redroid/redroid:13.0.0-arm64 redroid/redroid:12.0.0-arm64 redroid/redroid:11.0.0-arm64 redroid/redroid:13.0.0-latest redroid/redroid:12.0.0-latest redroid/redroid:11.0.0-latest; do
            if timeout 300 docker pull "$IMG" 2>&1 | tail -2; then
              A=$(docker image inspect --format '{{.Architecture}}' "$IMG" 2>/dev/null || echo "?")
              echo "$IMG arch=$A"
              if [ "$A" = "arm64" ]; then FOUND="$IMG"; break; fi
            fi
          done
          echo "FOUND=$FOUND"
          [ -n "$FOUND" ] || exit 1
          echo "image=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Start redroid
        env:
          IMG: ${{ steps.img.outputs.image }}
        run: |
          sudo modprobe binder_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          docker run -d --privileged --name redroid -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            "$IMG" \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320
          sleep 30
          docker ps -a

      - name: Adb setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb curl python3 2>/dev/null || true
          adb kill-server || true; adb start-server || true; adb disconnect || true; sleep 2
          adb connect 127.0.0.1:5555 || true; sleep 5
          adb devices -l
          A="adb -s 127.0.0.1:5555"
          for i in $(seq 1 40); do
            B=$($A shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && { echo BOOTED; break; }
            sleep 5
          done
          $A shell id || true

      - name: Install XHS
        run: |
          curl -L --retry 3 -o xhs.apk "https://github.com/Sakry1216/xhs-re-cloud/releases/download/apk-v1/xhs_official.apk"
          A="adb -s 127.0.0.1:5555"
          timeout 600 $A install -r xhs.apk 2>&1 | tail -3 || true
          $A shell pm list packages | grep xingin || true

      - name: Dismiss notice + launch XHS
        run: |
          A="adb -s 127.0.0.1:5555"
          $A shell settings put global window_attention_anim_duration 0 2>/dev/null || true
          for round in 1 2 3; do
            $A shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/ui.xml > ui.xml 2>/dev/null || true
            COORD=$(python3 - <<'EOF'
import re, sys
try:
    t = open('ui.xml', encoding='utf-8', errors='replace').read()
except Exception:
    print(''); sys.exit()
for m in re.finditer(r'text="([^"]+)"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', t):
    if m.group(1).strip().lower() in ('agree', '同意', 'allow'):
        x = (int(m.group(2)) + int(m.group(4))) // 2
        y = (int(m.group(3)) + int(m.group(5))) // 2
        print(f'{x} {y}'); sys.exit()
print('')
EOF
)
            echo "round=$round coord=$COORD"
            if [ -n "$COORD" ]; then $A shell input tap $COORD; fi
            sleep 3
          done
          $A exec-out screencap -p > after_notice.png || true
          $A shell am start -n com.xingin.xhs/com.xingin.xhs.index.v2.IndexActivityV2 || true
          sleep 25
          $A exec-out screencap -p > xhs_a.png || true
          $A shell uiautomator dump /sdcard/ui2.xml >/dev/null 2>&1 || true
          $A shell cat /sdcard/ui2.xml > ui2.xml 2>/dev/null || true
          python3 - <<'EOF' || true
import re
try:
    t = open('ui2.xml', encoding='utf-8', errors='replace').read()
    for m in re.finditer(r'text="([^"]{1,40})"', t):
        print('TEXT:', m.group(1))
except Exception as e:
    print('parse err', e)
EOF
          $A shell input tap 540 1000 || true
          sleep 12
          $A exec-out screencap -p > xhs_b.png || true
          $A logcat -d > logcat.txt 2>&1 || true
          ls -l *.png *.txt *.xml || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-xhs
          path: |
            after_notice.png
            xhs_a.png
            xhs_b.png
            logcat.txt
            ui.xml
            ui2.xml
