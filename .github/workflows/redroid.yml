name: redroid-xhs
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull redroid arm64
        id: img
        run: |
          FOUND=""
          for IMG in redroid/redroid:13.0.0-arm64 redroid/redroid:12.0.0-arm64 redroid/redroid:11.0.0-arm64 redroid/redroid:13.0.0-latest redroid/redroid:12.0.0-latest redroid/redroid:11.0.0-latest; do
            if timeout 300 docker pull "$IMG" 2>&1 | tail -2; then
              A=$(docker image inspect --format '{{.Architecture}}' "$IMG" 2>/dev/null || echo "?")
              echo "$IMG arch=$A"
              if [ "$A" = "arm64" ]; then FOUND="$IMG"; break; fi
            fi
          done
          echo "FOUND=$FOUND"
          [ -n "$FOUND" ] || exit 1
          echo "image=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Start redroid
        env:
          IMG: ${{ steps.img.outputs.image }}
        run: |
          sudo modprobe binder_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          docker run -d --privileged --name redroid -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            "$IMG" \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320
          sleep 30
          docker ps -a

      - name: Adb setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb curl python3 2>/dev/null || true
          adb kill-server || true
          adb start-server || true
          adb disconnect || true
          sleep 2
          adb connect 127.0.0.1:5555 || true
          sleep 5
          A="adb -s 127.0.0.1:5555"
          for i in $(seq 1 40); do
            B=$($A shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then echo BOOTED; break; fi
            sleep 5
          done
          $A shell settings put system system_locales zh-CN || true

      - name: Install XHS
        run: |
          curl -L --retry 3 -o xhs.apk "https://github.com/Sakry1216/xhs-re-cloud/releases/download/apk-v1/xhs_official.apk"
          A="adb -s 127.0.0.1:5555"
          timeout 600 $A install -r xhs.apk 2>&1 | tail -3 || true

      - name: Explore login options
        run: |
          A="adb -s 127.0.0.1:5555"
          $A shell am start -n com.xingin.xhs/com.xingin.xhs.index.v2.IndexActivityV2 || true
          sleep 12
          $A shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1 || true
          $A shell cat /sdcard/u.xml > u.xml 2>/dev/null || true
          C=$(python3 scripts/tap_text.py u.xml "Agree,同意" || true)
          if [ -n "$C" ]; then $A shell input tap $C || true; fi
          sleep 6
          for i in 1 2 3; do
            $A shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/u.xml > u.xml 2>/dev/null || true
            C=$(python3 scripts/tap_text.py u.xml "ALLOW,Allow,允许" || true)
            if [ -n "$C" ]; then $A shell input tap $C || true; fi
            sleep 3
          done
          $A shell input keyevent KEYCODE_BACK || true
          sleep 3
          for round in 1 2 3 4 5 6; do
            $A shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/u.xml > u.xml 2>/dev/null || true
            C=$(python3 scripts/tap_text.py u.xml "Get started,Sign in,Log in,登录,Continue,Next" || true)
            if [ -n "$C" ]; then $A shell input tap $C || true; fi
            sleep 4
          done
          $A exec-out screencap -p > p_login.png || true
          $A shell uiautomator dump /sdcard/l.xml >/dev/null 2>&1 || true
          $A shell cat /sdcard/l.xml > l.xml 2>/dev/null || true
          echo "===== login page texts ====="
          python3 scripts/dump_ui.py l.xml | head -80 || true
          # 尝试 Help / 更多 / 其他方式
          for label in "Help,帮助" "Other,其他登录方式,Other ways" "Password,密码,Password login" "QR,二维码,Scan,扫码" "Email,邮箱"; do
            $A shell uiautomator dump /sdcard/t.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/t.xml > t.xml 2>/dev/null || true
            C=$(python3 scripts/tap_text.py t.xml "$label" || true)
            echo "try [$label] coord=[$C]"
            if [ -n "$C" ]; then
              $A shell input tap $C || true
              sleep 4
              $A exec-out screencap -p > opt_$(echo "$label" | cut -d, -f1 | tr -d ' ').png || true
              $A shell uiautomator dump /sdcard/o.xml >/dev/null 2>&1 || true
              $A shell cat /sdcard/o.xml > o.xml 2>/dev/null || true
              python3 scripts/dump_ui.py o.xml | head -40 || true
              $A shell input keyevent KEYCODE_BACK || true
              sleep 2
            fi
          done
          $A exec-out screencap -p > p_final.png || true
          ls -l *.png *.xml || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-login-options
          path: |
            p_login.png
            p_final.png
            opt_*.png
            u.xml
            l.xml
            t.xml
            o.xml
