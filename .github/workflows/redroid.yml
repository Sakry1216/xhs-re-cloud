name: redroid-xhs
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull redroid arm64
        id: img
        run: |
          FOUND=""
          for IMG in redroid/redroid:13.0.0-arm64 redroid/redroid:12.0.0-arm64 redroid/redroid:11.0.0-arm64 redroid/redroid:13.0.0-latest redroid/redroid:12.0.0-latest redroid/redroid:11.0.0-latest; do
            if timeout 300 docker pull "$IMG" 2>&1 | tail -2; then
              A=$(docker image inspect --format '{{.Architecture}}' "$IMG" 2>/dev/null || echo "?")
              echo "$IMG arch=$A"
              if [ "$A" = "arm64" ]; then FOUND="$IMG"; break; fi
            fi
          done
          echo "FOUND=$FOUND"
          [ -n "$FOUND" ] || exit 1
          echo "image=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Start redroid
        env:
          IMG: ${{ steps.img.outputs.image }}
        run: |
          sudo modprobe binder_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          docker run -d --privileged --name redroid -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            "$IMG" \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320
          sleep 30
          docker ps -a

      - name: Adb setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb curl python3 2>/dev/null || true
          adb kill-server || true
          adb start-server || true
          adb disconnect || true
          sleep 2
          adb connect 127.0.0.1:5555 || true
          sleep 5
          A="adb -s 127.0.0.1:5555"
          for i in $(seq 1 40); do
            B=$($A shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then echo BOOTED; break; fi
            sleep 5
          done
          $A shell settings put system system_locales zh-CN || true

      - name: Install XHS
        run: |
          curl -L --retry 3 -o xhs.apk "https://github.com/Sakry1216/xhs-re-cloud/releases/download/apk-v1/xhs_official.apk"
          A="adb -s 127.0.0.1:5555"
          timeout 600 $A install -r xhs.apk 2>&1 | tail -3 || true

      - name: Login with code
        run: |
          A="adb -s 127.0.0.1:5555"
          $A shell am start -n com.xingin.xhs/com.xingin.xhs.index.v2.IndexActivityV2 || true
          sleep 12
          $A shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1 || true
          $A shell cat /sdcard/u.xml > u.xml 2>/dev/null || true
          C=$(python3 scripts/tap_text.py u.xml "Agree,同意" || true)
          if [ -n "$C" ]; then $A shell input tap $C || true; fi
          sleep 6
          for i in 1 2 3; do
            $A shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/u.xml > u.xml 2>/dev/null || true
            C=$(python3 scripts/tap_text.py u.xml "ALLOW,Allow,允许" || true)
            if [ -n "$C" ]; then $A shell input tap $C || true; fi
            sleep 3
          done
          $A shell input keyevent KEYCODE_BACK || true
          sleep 3
          for round in 1 2 3 4 5 6; do
            $A shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/u.xml > u.xml 2>/dev/null || true
            C=$(python3 scripts/tap_text.py u.xml "Get started,Sign in,Log in,登录,Continue,Next" || true)
            if [ -n "$C" ]; then $A shell input tap $C || true; fi
            sleep 4
          done
          # 国家码 +86
          $A shell input tap 140 300 || true
          sleep 4
          $A shell uiautomator dump /sdcard/c.xml >/dev/null 2>&1 || true
          $A shell cat /sdcard/c.xml > c.xml 2>/dev/null || true
          C=$(python3 scripts/tap_text.py c.xml "China,中国,+86" || true)
          if [ -n "$C" ]; then $A shell input tap $C || true; fi
          if [ -z "$C" ]; then
            $A shell input swipe 540 1200 540 600 300 || true
            sleep 2
            $A shell uiautomator dump /sdcard/c.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/c.xml > c.xml 2>/dev/null || true
            C=$(python3 scripts/tap_text.py c.xml "China,中国,+86" || true)
            if [ -n "$C" ]; then $A shell input tap $C || true; fi
          fi
          sleep 2
          $A shell input tap 540 300 || true
          sleep 2
          $A shell input text "19816583197" || true
          sleep 3
          $A exec-out screencap -p > phone_entered.png || true
          $A shell uiautomator dump /sdcard/u3.xml >/dev/null 2>&1 || true
          $A shell cat /sdcard/u3.xml > u3.xml 2>/dev/null || true
          C=$(python3 scripts/tap_text.py u3.xml "Continue,下一步,Next" || true)
          echo "continue coord=[$C]"
          if [ -n "$C" ]; then $A shell input tap $C || true; fi
          sleep 8
          $A exec-out screencap -p > code_page.png || true
          $A shell uiautomator dump /sdcard/u4.xml >/dev/null 2>&1 || true
          $A shell cat /sdcard/u4.xml > u4.xml 2>/dev/null || true
          python3 scripts/dump_ui.py u4.xml | head -50 || true
          # 多轮尝试验证码：预设的、以及后续更新到 code.txt 的新码
          TRIED=""
          for attempt in $(seq 1 60); do
            curl -s -m 10 "https://raw.githubusercontent.com/Sakry1216/xhs-re-cloud/main/code.txt" -o code.txt || true
            CODE=$(tr -d ' \r\n' < code.txt 2>/dev/null | head -c 8)
            echo "attempt=$attempt code=[$CODE] tried=[$TRIED]"
            if [ -z "$CODE" ] || [ "$CODE" = "none" ]; then sleep 8; continue; fi
            CASE=$(echo "$TRIED" | grep -c "$CODE" || true)
            if [ "$CASE" -gt 0 ]; then sleep 8; continue; fi
            TRIED="$TRIED $CODE"
            $A shell input tap 540 300 || true
            sleep 1
            $A shell input keyevent KEYCODE_MOVE_END || true
            for d in 1 2 3 4 5 6 7 8; do $A shell input keyevent KEYCODE_DEL || true; done
            $A shell input text "$CODE" || true
            sleep 2
            $A exec-out screencap -p > try_${attempt}.png || true
            $A shell uiautomator dump /sdcard/u5.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/u5.xml > u5.xml 2>/dev/null || true
            C=$(python3 scripts/tap_text.py u5.xml "Continue,下一步,Next,Log in,Sign in,登录,Verify" || true)
            echo "submit coord=[$C]"
            if [ -n "$C" ]; then $A shell input tap $C || true; fi
            sleep 15
            $A exec-out screencap -p > after_${attempt}.png || true
            $A shell uiautomator dump /sdcard/u6.xml >/dev/null 2>&1 || true
            $A shell cat /sdcard/u6.xml > u6.xml 2>/dev/null || true
            TXT=$(python3 scripts/dump_ui.py u6.xml 2>/dev/null | head -40 || true)
            echo "$TXT"
            if echo "$TXT" | grep -qE "首页|发现|消息|我  |Profile|Home|Explore"; then echo "LOGIN_OK"; break; fi
            if echo "$TXT" | grep -qiE "invalid|incorrect|wrong|expired|错误|失效|不正确|验证码"; then echo "CODE_REJECTED"; fi
          done
          $A exec-out screencap -p > final.png || true
          $A shell uiautomator dump /sdcard/u7.xml >/dev/null 2>&1 || true
          $A shell cat /sdcard/u7.xml > u7.xml 2>/dev/null || true
          python3 scripts/dump_ui.py u7.xml | head -60 || true
          $A logcat -d > logcat.txt 2>&1 || true
          ls -l *.png *.xml *.txt 2>/dev/null | tail -20 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-login
          path: |
            phone_entered.png
            code_page.png
            try_*.png
            after_*.png
            final.png
            u4.xml
            u5.xml
            u6.xml
            u7.xml
            logcat.txt
