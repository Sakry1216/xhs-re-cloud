name: redroid-xhs
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: System info
        run: uname -a; nproc; free -h; docker --version

      - name: Find redroid image
        id: tag
        run: |
          set -x
          FOUND=""
          for IMG in \
            redroid/redroid:13.0.0_arm64 redroid/redroid:12.0.0_arm64 redroid/redroid:11.0.0_arm64 \
            redroid/redroid:14.0.0_arm64 redroid/redroid:15.0.0_arm64 \
            redroid/redroid:13.0.0 redroid/redroid:12.0.0 redroid/redroid:11.0.0 redroid/redroid:latest; do
            echo "== try $IMG"
            if timeout 240 docker pull "$IMG"; then FOUND="$IMG"; break; fi
          done
          echo "FOUND=$FOUND"
          if [ -z "$FOUND" ]; then
            echo "ALL_PULL_FAILED"
            timeout 60 curl -sS "https://hub.docker.com/v2/repositories/redroid/redroid/tags?page_size=25" | head -c 2000 || true
            exit 1
          fi
          echo "image=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Start redroid
        run: |
          set -x
          sudo modprobe binder_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          ls -l /dev/binderfs || true
          IMG="redroid/redroid:13.0.0_arm64"
          if [ ! -z "$(grep -o 'image=.*' /dev/null 2>/dev/null)" ]; then true; fi
          IMG_FILE="/tmp/redroid_img.txt"
          if [ -f "$IMG_FILE" ]; then IMG=$(cat "$IMG_FILE"); fi
          docker run -d --privileged --name redroid -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            redroid/redroid:13.0.0_arm64 \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320 || \
          docker run -d --privileged --name redroid -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            redroid/redroid:12.0.0_arm64 \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320 || \
          docker run -d --privileged --name redroid -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            redroid/redroid:11.0.0_arm64 \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320 || true
          sleep 25
          docker ps -a
          docker logs redroid 2>&1 | tail -80 || true

      - name: Setup adb
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb curl jq 2>/dev/null || true
          adb start-server || true
          for i in $(seq 1 40); do adb connect 127.0.0.1:5555 && break; sleep 3; done
          sleep 10
          adb devices
          for i in $(seq 1 30); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "boot=$B"; [ "$B" = "1" ] && break; sleep 5
          done
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.product.cpu.abilist || true
          adb shell "ls /system/lib/arm 2>/dev/null | head -3" || true

      - name: Install XHS
        run: |
          set -x
          curl -L --retry 3 -o xhs.apk "https://github.com/Sakry1216/xhs-re-cloud/releases/download/apk-v1/xhs_official.apk"
          ls -l xhs.apk
          adb install -r xhs.apk || adb install -r --no-streaming xhs.apk || echo INSTALL_FAILED
          adb shell pm list packages | grep xingin || true

      - name: Launch XHS
        run: |
          set -x
          adb shell settings put global window_animation_scale 0 || true
          adb shell am start -n com.xingin.xhs/com.xingin.xhs.index.v2.IndexActivityV2 || true
          sleep 35
          adb shell dumpsys window | grep mCurrentFocus || true
          adb shell pidof com.xingin.xhs || true
          adb shell screencap -p /sdcard/s1.png && adb pull /sdcard/s1.png shot1.png || true
          adb logcat -d | tail -800 > logcat.txt || true
          ls -l shot1.png logcat.txt || true

      - name: Diagnostics
        if: always()
        run: |
          docker logs redroid 2>&1 | tail -100 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-run
          path: |
            shot1.png
            logcat.txt
