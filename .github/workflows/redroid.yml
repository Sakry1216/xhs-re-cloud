name: redroid-xhs
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Pull redroid arm64
        id: img
        run: |
          set -x
          FOUND=""
          for IMG in redroid/redroid:13.0.0-arm64 redroid/redroid:12.0.0-arm64 redroid/redroid:11.0.0-arm64 redroid/redroid:13.0.0-latest redroid/redroid:12.0.0-latest redroid/redroid:11.0.0-latest; do
            if timeout 300 docker pull "$IMG" 2>&1 | tail -2; then
              A=$(docker image inspect --format '{{.Architecture}}' "$IMG" 2>/dev/null || echo "?")
              echo "$IMG arch=$A"
              if [ "$A" = "arm64" ]; then FOUND="$IMG"; break; fi
            fi
          done
          echo "FOUND=$FOUND"
          [ -n "$FOUND" ] || exit 1
          echo "image=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Start redroid
        env:
          IMG: ${{ steps.img.outputs.image }}
        run: |
          set -x
          sudo modprobe binder_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          docker run -d --privileged --name redroid -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            "$IMG" \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320
          sleep 30
          docker ps -a

      - name: Adb setup
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb curl xz-utils python3-pip 2>/dev/null || true
          adb kill-server || true
          adb start-server || true
          adb disconnect || true
          sleep 2
          adb connect 127.0.0.1:5555 || true
          sleep 5
          adb devices -l
          A="adb -s 127.0.0.1:5555"
          for i in $(seq 1 40); do
            B=$($A shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && { echo BOOTED; break; }
            sleep 5
          done
          $A shell id || true
          $A shell getprop ro.build.version.release || true
          $A shell getprop ro.product.cpu.abilist || true

      - name: Install XHS
        run: |
          set -x
          curl -L --retry 3 -o xhs.apk "https://github.com/Sakry1216/xhs-re-cloud/releases/download/apk-v1/xhs_official.apk"
          A="adb -s 127.0.0.1:5555"
          timeout 600 $A install -r xhs.apk 2>&1 | tail -3 || true
          $A shell pm list packages | grep xingin || true

      - name: Dismiss notice + launch XHS
        run: |
          set -x
          A="adb -s 127.0.0.1:5555"
          $A shell input tap 540 1215 || true
          sleep 4
          $A exec-out screencap -p > notice_dismissed.png || true
          $A shell settings put global window_animation_scale 0 || true
          $A shell am start -n com.xingin.xhs/com.xingin.xhs.index.v2.IndexActivityV2 || true
          sleep 20
          $A exec-out screencap -p > xhs1.png || true
          $A shell dumpsys window | grep mCurrentFocus || true
          $A shell input tap 540 620 || true
          sleep 8
          $A exec-out screencap -p > xhs2.png || true
          $A logcat -d > logcat.txt 2>&1 || true
          ls -l *.png *.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-xhs
          path: |
            notice_dismissed.png
            xhs1.png
            xhs2.png
            logcat.txt
