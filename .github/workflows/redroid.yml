name: redroid-xhs
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: System info
        run: uname -a; nproc; free -h; docker --version

      - name: Find redroid arm64 tag
        id: tag
        run: |
          set -x
          python3 - <<'EOF' > /tmp/tags.txt
          import json, urllib.request
          out = []
          for page in (1, 2):
              u = f"https://hub.docker.com/v2/repositories/redroid/redroid/tags?page_size=100&page={page}"
              try:
                  d = json.load(urllib.request.urlopen(u, timeout=30))
                  out += [t["name"] for t in d.get("results", [])]
              except Exception as e:
                  print("ERR", e)
          print("\n".join(out))
          EOF
          cat /tmp/tags.txt | head -80 || true
          ARM=$(grep -E '_arm64$' /tmp/tags.txt | head -1 || true)
          if [ -z "$ARM" ]; then ARM=$(grep -E 'arm64' /tmp/tags.txt | head -1 || true); fi
          if [ -z "$ARM" ]; then
            for t in 11.0.0_arm64 12.0.0_arm64 13.0.0_arm64 11.0.0_arm64-latest; do
              if docker manifest inspect redroid/redroid:$t >/dev/null 2>&1; then ARM=$t; break; fi
            done
          fi
          echo "ARM_TAG=$ARM"
          echo "arm_tag=$ARM" >> "$GITHUB_OUTPUT"

      - name: Start redroid
        run: |
          set -x
          sudo modprobe binder_linux || true
          sudo mount -t binder binder /dev/binderfs 2>/dev/null || sudo mkdir -p /dev/binderfs && sudo mount -t binder binder /dev/binderfs || true
          ls -l /dev/binderfs || true
          TAG="${{ steps.tag.outputs.arm_tag }}"
          if [ -z "$TAG" ]; then echo "NO ARM TAG"; exit 1; fi
          docker pull redroid/redroid:$TAG || exit 1
          docker run -d --privileged --name redroid -p 5555:5555 \
            -v /dev/binderfs:/dev/binderfs \
            redroid/redroid:$TAG \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 androidboot.redroid_dpi=320
          sleep 25
          docker ps -a
          docker logs redroid 2>&1 | tail -60

      - name: Setup adb
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-tools-common adb curl jq 2>/dev/null || sudo apt-get install -y -qq adb curl jq
          adb start-server
          for i in $(seq 1 40); do adb connect 127.0.0.1:5555 && break; sleep 3; done
          sleep 10
          adb devices
          for i in $(seq 1 30); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "boot=$B"; [ "$B" = "1" ] && break; sleep 5
          done
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.product.cpu.abilist || true
          adb shell "ls /system/lib/arm 2>/dev/null | head -3" || true

      - name: Install XHS
        run: |
          set -x
          curl -L --retry 3 -o xhs.apk "https://github.com/Sakry1216/xhs-re-cloud/releases/download/apk-v1/xhs_official.apk"
          ls -l xhs.apk
          adb install -r xhs.apk || adb install -r --no-streaming xhs.apk || echo INSTALL_FAILED
          adb shell pm list packages | grep xingin || true

      - name: Launch XHS
        run: |
          set -x
          adb shell settings put global window_animation_scale 0 || true
          adb shell am start -n com.xingin.xhs/com.xingin.xhs.index.v2.IndexActivityV2 || true
          sleep 35
          adb shell dumpsys window | grep mCurrentFocus || true
          adb shell pidof com.xingin.xhs || true
          adb shell screencap -p /sdcard/s1.png && adb pull /sdcard/s1.png shot1.png || true
          adb logcat -d | tail -800 > logcat.txt || true
          ls -l shot1.png logcat.txt || true

      - name: Diagnostics
        if: always()
        run: |
          docker logs redroid 2>&1 | tail -100 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-run
          path: |
            shot1.png
            logcat.txt
