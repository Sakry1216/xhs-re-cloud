name: arch-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest]
    steps:
      - name: Probe
        run: |
          set -x
          uname -a
          uname -m
          nproc
          free -h || true
          ls -l /dev/kvm || echo NO_KVM
          ls -l /dev/binder* /dev/binderfs 2>/dev/null || echo NO_BINDER
          sudo modprobe binder_linux || echo modprobe_binder_failed
          cat /proc/filesystems | grep -i binder || echo no_binder_fs
          which java || true
          ls /opt/hostedtoolcache 2>/dev/null | head
